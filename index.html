<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flujo: gestor de tareas Kanban open source. Organizá tableros, columnas, tareas, prioridades, fechas de entrega y colaboradores."
    />
    <meta name="theme-color" content="#6366f1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flujo · Gestor de tareas Kanban" />
    <meta
      property="og:description"
      content="Tableros, columnas, tareas, prioridades, fechas de entrega y colaboradores. Open source, sin backend y con guardado automático."
    />
    <title>Flujo · Gestor de tareas Kanban</title>
    <script>
      try {
        var raw = localStorage.getItem('flujo.state.v1');
        var stored = raw ? JSON.parse(raw).theme : null;
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
